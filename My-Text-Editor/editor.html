<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EBook Editor</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Georgia, serif;

    background:
        radial-gradient(circle at center, #444 0%, #222 100%);
}

/* =========================
   BOOK
========================= */

.book {
    width: 92vw;
    max-width: 950px;
    height: 88vh;

    display: flex;

    border-radius: 8px;
    overflow: hidden;

    box-shadow:
        0 20px 50px rgba(0,0,0,0.6),
        0 0 15px rgba(0,0,0,0.4);
}

/* =========================
   PAGE
========================= */

.page {
    position: relative;

    width: 50%;
    height: 100%;

    padding: 55px 35px 45px;

    background:
        linear-gradient(
            to right,
            rgba(0,0,0,0.05),
            transparent 15%,
            transparent 85%,
            rgba(0,0,0,0.05)
        ),
        #fffdf2;
}

.left {
    background-color: #f7f0d8;

    border-right: 1px solid rgba(0,0,0,0.18);

    box-shadow:
        inset -8px 0 15px rgba(0,0,0,0.06);
}

/* =========================
   WRITING AREA
========================= */

.textarea {
    position: absolute;

    top: 55px;
    left: 25px;
    right: 25px;
    bottom: 45px;

    width: calc(100% - 50px);
    height: calc(100% - 100px);

    resize: none;

    border: none;
    outline: none;

    padding: 4px 8px;

    font-family: Georgia, serif;
    font-size: 18px;

    line-height: 28px;

    color: #222;

    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 27px,
            rgba(80,80,80,0.25) 28px
        );

    overflow-y: auto;
}

/* =========================
   DATE
========================= */

.date-input {
    position: absolute;

    top: 15px;
    right: 20px;

    width: 115px;

    border: none;
    outline: none;

    background: transparent;

    font-family: Georgia, serif;
    font-size: 14px;

    text-align: right;

    color: #333;
}

.date-input::placeholder {
    color: #777;
}

/* =========================
   PAGE NUMBER
========================= */

.page-number {
    position: absolute;

    bottom: 12px;
    left: 18px;

    font-size: 12px;

    color: #555;
}

/* =========================
   TITLE
========================= */

.title {
    position: absolute;

    top: 42%;
    left: 0;
    right: 0;

    text-align: center;

    font-size: 42px;

    color: #333;
}

/* =========================
   NAVIGATION
========================= */

.navigation {
    position: absolute;

    bottom: 10px;
    right: 15px;

    display: flex;
    gap: 6px;
}

button {
    border: none;

    padding: 6px 10px;

    border-radius: 5px;

    background: #444;
    color: white;

    font-size: 15px;

    cursor: pointer;

    transition: 0.15s;
}

button:hover {
    background: #222;
}

button:active {
    transform: scale(0.95);
}

/* =========================
   IMPORT BUTTON
========================= */

.import-button {
    position: absolute;

    top: 12px;
    left: 15px;

    font-size: 13px;

    padding: 5px 8px;
}

/* =========================
   SMALL SCREENS
========================= */

@media (max-width: 700px) {

    .book {
        width: 96vw;
        height: 90vh;
    }

    .page {
        padding-left: 20px;
        padding-right: 20px;
    }

    .textarea {
        left: 15px;
        right: 15px;

        width: calc(100% - 30px);
    }

    .title {
        font-size: 30px;
    }

    .textarea {
        font-size: 16px;
        line-height: 26px;
    }
}
</style>
</head>

<body>

<div class="book">

    <!-- =========================
         LEFT PAGE
    ========================== -->

    <div class="page left">

        <button
            class="import-button"
            onclick="importDiary()">
            Import
        </button>

        <div
            class="page-number"
            id="leftPageNumber">
        </div>

        <div id="leftContent"></div>

    </div>


    <!-- =========================
         RIGHT PAGE
    ========================== -->

    <div class="page">

        <input
            class="date-input"
            id="dateInput"
            type="text"
            placeholder="DD/MM/YYYY"
            maxlength="10"
        >

        <div
            class="page-number"
            id="rightPageNumber">
        </div>

        <div id="rightContent"></div>

        <div class="navigation">

            <button onclick="previousPages()">
                ←
            </button>

            <button onclick="nextPages()">
                →
            </button>

        </div>

    </div>

</div>


<script>

/* ==================================================
   DATA
================================================== */

let currentPage = 0;

let pages =
    JSON.parse(localStorage.getItem("diaryPages"))
    || ["", ""];

let dates =
    JSON.parse(localStorage.getItem("diaryDates"))
    || ["", ""];


/* ==================================================
   MAKE SURE DATA EXISTS
================================================== */

function makePageExist(index) {

    if (pages[index] === undefined) {
        pages[index] = "";
    }

    if (dates[index] === undefined) {
        dates[index] = "";
    }
}


/* ==================================================
   SAVE TO BROWSER
================================================== */

function saveDiary() {

    localStorage.setItem(
        "diaryPages",
        JSON.stringify(pages)
    );

    localStorage.setItem(
        "diaryDates",
        JSON.stringify(dates)
    );
}


/* ==================================================
   DISPLAY PAGES
================================================== */

function render() {

    makePageExist(currentPage);
    makePageExist(currentPage + 1);

    const leftContent =
        document.getElementById("leftContent");

    const rightContent =
        document.getElementById("rightContent");

    const dateInput =
        document.getElementById("dateInput");

    const leftNumber =
        document.getElementById("leftPageNumber");

    const rightNumber =
        document.getElementById("rightPageNumber");


    /* PAGE NUMBERS */

    leftNumber.textContent =
        "Page " + (currentPage + 1);

    rightNumber.textContent =
        "Page " + (currentPage + 2);


    /* =========================
       LEFT PAGE
    ========================== */

    if (currentPage === 0) {

        leftContent.innerHTML =
            '<div class="title">To make text appear here as Title, change title in your .json file that you will save.</div>';

    } else {

        leftContent.innerHTML =
            '<textarea class="textarea" id="leftText"></textarea>';

        const leftText =
            document.getElementById("leftText");

        leftText.value =
            pages[currentPage];

        leftText.addEventListener(
            "input",
            function () {

                pages[currentPage] =
                    leftText.value;

                saveDiary();

            }
        );
    }


    /* =========================
       RIGHT PAGE
    ========================== */

    rightContent.innerHTML =
        '<textarea class="textarea" id="rightText"></textarea>';

    const rightText =
        document.getElementById("rightText");

    rightText.value =
        pages[currentPage + 1];

    rightText.addEventListener(
        "input",
        function () {

            pages[currentPage + 1] =
                rightText.value;

            saveDiary();

        }
    );


    /* =========================
       DATE
    ========================== */

    dateInput.value =
        dates[currentPage + 1];

    dateInput.oninput = function () {

        dates[currentPage + 1] =
            dateInput.value;

        saveDiary();

    };
}


/* ==================================================
   NEXT
================================================== */

function nextPages() {

    currentPage += 2;

    makePageExist(currentPage);
    makePageExist(currentPage + 1);

    saveDiary();

    render();
}


/* ==================================================
   PREVIOUS
================================================== */

function previousPages() {

    if (currentPage === 0) {
        return;
    }

    currentPage -= 2;

    render();
}


/* ==================================================
   CTRL + S
================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.ctrlKey &&
            event.key.toLowerCase() === "s"
        ) {

            event.preventDefault();

            const save = confirm(
                "Save Book?\n\n" +
                "OK = Save\n" +
                "Cancel = Cancel"
            );

            if (save) {
                exportNormal();
            }

        }

    }
);


/* ==================================================
   READABLE EXPORT
================================================== */

function exportReadable() {

    let output =
        "EBook Editor\n\n";


    for (let i = 0; i < pages.length; i++) {

        output +=
            "====================\n";

        output +=
            "Page " + (i + 1);

        if (dates[i]) {

            output +=
                " — " + dates[i];

        }

        output +=
            "\n====================\n\n";

        output +=
            pages[i] || "";

        output +=
            "\n\n";

    }


    downloadFile(
        "MyDiary.txt",
        output,
        "text/plain"
    );
}


/* ==================================================
   NORMAL JSON EXPORT
================================================== */

function exportNormal() {

    const diaryData = {

        version: 1,

        pages: pages,

        dates: dates

    };


    const output =
        JSON.stringify(
            diaryData,
            null,
            2
        );


    downloadFile(
        "MyDiary.json",
        output,
        "application/json"
    );
}


/* ==================================================
   DOWNLOAD
================================================== */

function downloadFile(
    filename,
    content,
    type
) {

    const blob =
        new Blob(
            [content],
            { type: type }
        );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href = url;

    link.download = filename;

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(url);
}


/* ==================================================
   IMPORT JSON
================================================== */

function importDiary() {

    const input =
        document.createElement("input");

    input.type = "file";

    input.accept = ".json,application/json";


    input.onchange =
        function(event) {

            const file =
                event.target.files[0];

            if (!file) {
                return;
            }


            const reader =
                new FileReader();


            reader.onload =
                function() {

                    try {

                        const imported =
                            JSON.parse(
                                reader.result
                            );


                        /* CHECK FILE */

                        if (
                            !Array.isArray(
                                imported.pages
                            ) ||
                            !Array.isArray(
                                imported.dates
                            )
                        ) {

                            alert(
                                "This is not a valid diary file."
                            );

                            return;
                        }


                        /* LOAD DATA */

                        pages =
                            imported.pages;

                        dates =
                            imported.dates;


                        /* SAVE */

                        saveDiary();


                        /* GO TO START */

                        currentPage = 0;


                        render();


                        alert(
                            "Diary imported successfully! ✓"
                        );

                    }

                    catch (error) {

                        alert(
                            "Could not read this diary file."
                        );

                    }

                };


            reader.readAsText(file);

        };


    input.click();
}


/* ==================================================
   START
================================================== */

render();

</script>

</body>
</html>
